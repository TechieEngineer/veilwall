name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - shell: bash
        run: if [ -f web/package-lock.json ]; then npm --prefix web ci; else npm --prefix web install; fi
      - run: npm --prefix web run build
      - name: Compile and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "release/veilwall-linux-$arch" ./cmd/veilwall
          done
          (cd release && sha256sum veilwall-* > SHA256SUMS)
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --prerelease --verify-tag --title "VeilWall $GITHUB_REF_NAME" --notes "Integrated policy-management beta. Simulation only; no packet enforcement."
